# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crop_insurance_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:meeta1308}
spring.datasource.driver-class-name=org.postgresql.Driver

# Security & Encryption Configuration
jwt.secret=${JWT_SECRET:CropInsuranceSecretKeyForJwtTokenGeneration2026WithHS256AlgorithmMustBe256BitsLong}
encryption.aes.key=${ENCRYPTION_KEY:CropInsuranceKey}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Level Configuration
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.examly.springapp=INFO

